name: hbts_driver
description: Highway Bus Transportation System - Driver App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  image_picker: ^1.2.1

  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.2.2
  web_socket_channel: ^2.4.0
  mobile_scanner: ^5.0.0

  # State Management
  provider: ^6.1.1

  # Location & Maps
  geolocator: ^10.1.0
  permission_handler: ^11.1.0
  google_maps_flutter: ^2.6.1
  flutter_polyline_points: ^2.0.0

  # Storage
  shared_preferences: ^2.2.2

  # UI Components
  flutter_spinkit: ^5.2.0
  fluttertoast: ^8.2.4

  # Date formatting
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
